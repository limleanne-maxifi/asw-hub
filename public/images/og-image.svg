<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1B2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Accent bar -->
  <rect width="1200" height="8" fill="#3B82F6"/>

  <!-- Main title -->
  <text x="600" y="150" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
    Airspace World 2026
  </text>

  <!-- Subtitle with blue accent -->
  <text x="600" y="265" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="bold" fill="#3B82F6" text-anchor="middle" dominant-baseline="middle">
    AI Visibility Hub
  </text>

  <!-- Tagline -->
  <text x="600" y="385" font-family="Inter, Arial, sans-serif" font-size="34" fill="#E5E7EB" text-anchor="middle" dominant-baseline="middle">
    A permanent, AI-citable reference for ASW 2026
  </text>

  <!-- Event line -->
  <text x="600" y="450" font-family="Inter, Arial, sans-serif" font-size="26" fill="#9CA3AF" text-anchor="middle" dominant-baseline="middle">
    26–28 May 2026 · FIL Lisbon · organised by CANSO
  </text>

  <!-- Curator line -->
  <text x="600" y="545" font-family="Inter, Arial, sans-serif" font-size="24" fill="#E5E7EB" text-anchor="middle" dominant-baseline="middle">
    Built &amp; curated by Maxifi Digital
  </text>

  <!-- Bottom accent -->
  <rect y="622" width="1200" height="8" fill="#3B82F6"/>
</svg>
