<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1B2E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Accent bar -->
  <rect width="1200" height="8" fill="#3B82F6"/>

  <!-- Main title -->
  <text x="600" y="140" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">
    Airspace World 2026
  </text>

  <!-- Subtitle with blue accent -->
  <text x="600" y="260" font-family="Inter, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#3B82F6" text-anchor="middle" dominant-baseline="middle">
    AI Knowledge Hub
  </text>

  <!-- Tagline -->
  <text x="600" y="380" font-family="Inter, -apple-system, sans-serif" font-size="36" fill="#E5E7EB" text-anchor="middle" dominant-baseline="middle">
