[build]
  base    = "asw-hub"
  publish = "_site"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from   = "/themes"
  to     = "/themes/"
  status = 301

[[redirects]]
  from   = "/sessions"
  to     = "/sessions/"
  status = 301

[[redirects]]
  from   = "/speakers"
  to     = "/speakers/"
  status = 301

[[redirects]]
  from   = "/insights"
  to     = "/insights/"
  status = 301
