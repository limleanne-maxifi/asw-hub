[build]
  base    = "."
  publish = "_site"
  command = "npm run clean && npm run build"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

## Domain alias redirect — airspaceworldhub.maxifidigital.com → aswhub.maxifidigital.com
## Step 1: Add airspaceworldhub.maxifidigital.com as a domain alias in Netlify UI
##         (Site settings → Domain management → Add domain alias)
## Step 2: This rule then handles the permanent redirect to the canonical domain:
[[redirects]]
  from   = "https://airspaceworldhub.maxifidigital.com/*"
  to     = "https://aswhub.maxifidigital.com/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "/themes"
  to     = "/themes/"
  status = 301

[[redirects]]
  from   = "/sessions"
  to     = "/sessions/"
  status = 301

[[redirects]]
  from   = "/speakers"
  to     = "/speakers/"
  status = 301

[[redirects]]
  from   = "/insights"
  to     = "/insights/"
  status = 301
