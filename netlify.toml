## ── /CANSO-demo/ retired → ai.maxifidigital.com/demo/canso/ (cutover 2026-07-31)
## The single-file CANSO demo is superseded by /demo/canso/ on the new host. The
## splat covers the whole tree, including the visibility-value-model companion —
## its sibling copy at public/demo-assets/visibility-value-explainer.html, which
## the live /demo/{slug} pages actually embed, is unaffected and still shipping
## from maxifi-pages.
##
## force = true is required here: public/CANSO-demo/ is still a passthrough, so
## the real files would otherwise win over the redirect. Nothing is deleted —
## the files stay in the repo and dropping these rules restores the pages.
##
## Lowercase aliases now point straight at the new target instead of chaining
## through /CANSO-demo/ (one 301 for the visitor, not two).
[[redirects]]
  from   = "/CANSO-demo/*"
  to     = "https://ai.maxifidigital.com/demo/canso/"
  status = 301
  force  = true

[[redirects]]
  from   = "/CANSO-demo"
  to     = "https://ai.maxifidigital.com/demo/canso/"
  status = 301
  force  = true

[[redirects]]
  from   = "/canso-demo/*"
  to     = "https://ai.maxifidigital.com/demo/canso/"
  status = 301
  force  = true

[[redirects]]
  from   = "/canso-demo"
  to     = "https://ai.maxifidigital.com/demo/canso/"
  status = 301
  force  = true

## Engine probe — proxy to the ai-visibility-engine backend on RAILWAY.
## status = 200 makes this a rewrite/proxy: the browser call to /demo/probe stays
## same-origin (no CORS), and Netlify forwards the POST (with the X-Demo-Token
## header) server-side. The slug "probe" is reserved (src/_data/demos.js).
##
## Repointed 2026-07-31: this pointed at ai-visibility-engine.onrender.com, which
## is dead — the engine moved Render → Railway, so every tester served from this
## host had been failing silently. Kept (rather than removed alongside the retired
## demo pages below) so the endpoint works if anything here is ever un-retired.
##
## MUST stay above the /demo/* redirects that follow — Netlify takes the first
## matching rule, so moving this below them would break the proxy.
[[redirects]]
  from   = "/demo/probe"
  to     = "https://web-production-00ba0.up.railway.app/demo/probe"
  status = 200
  force  = true

